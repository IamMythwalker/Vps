name: klien
on:
  push:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: setup klien as admin with rdp
      shell: cmd
      run: |
        echo setting up klien user with admin rights
        net user Klein "Mythwalker@07" /add
        net localgroup "Remote Desktop Users" Klein /add
        net localgroup Administrators Klein /add
        reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
        reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
        netsh advfirewall firewall set rule group="Remote Desktop" new enable=Yes
        netsh advfirewall firewall add rule name="RDP TCP" dir=in action=allow protocol=TCP localport=3389
        echo klien is now full administrator

    - name: cloudflare tunnel
      shell: cmd
      run: |
        echo setting up cloudflare tunnel
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -o cloudflared.exe
        start /b cloudflared.exe tunnel run --token eyJhIjoiY2U5MWFiYmQyYWU3YjhlZjQxMmU0YWQxODJmYzUxYzciLCJ0IjoiOTU2MjhkNmItMDcyNC00ODkzLWIyOWYtYjc5ZTBiOTNkOTM3IiwicyI6IlpUZGlOR1l4TW1FdE1EY3dOUzAwWVRCaUxXRmpNemN0T1dFNFlXUXlZVEJoTlRReCJ9 > cf.log 2>&1
        timeout /t 20 /nobreak >nul
        echo ===== cloudflared log =====
        type cf.log
        echo ===========================

    - name: connection details
      shell: cmd
      run: |
        echo ==================================
        echo login info:
        echo username: klein
        echo password: Mythwalker@07
        echo full admin - install chrome or anything
        echo 1. use the public hostname configured in your tunnel
        echo 2. mstsc /v:YOUR_TUNNEL_HOSTNAME
        echo ==================================

    - name: keep alive 6 hours
      timeout-minutes: 350
      shell: cmd
      run: ping 127.0.0.1 -n 21000 >nul.
